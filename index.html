<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI로 포켓몬 찾기</title>
<style>
  :root {
    --cream: #fff8e7;
    --cream-dark: #fdeeb8;
    --yellow: #ffd54f;
    --yellow-dark: #ffb300;
    --brown: #6d4c1f;
    --brown-light: #8a6a3a;
    --card-shadow: 0 8px 20px rgba(180, 140, 40, 0.25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-dark) 100%);
    color: var(--brown);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }

  .container {
    width: 100%;
    max-width: 720px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 2.2rem;
    margin: 0 0 8px;
    color: var(--brown);
  }

  header p {
    font-size: 1.15rem;
    color: var(--brown-light);
    margin: 0;
  }

  .mbti-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  @media (max-width: 480px) {
    .mbti-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .mbti-btn {
    font-size: 1.4rem;
    font-weight: 700;
    padding: 18px 8px;
    border: none;
    border-radius: 16px;
    background: #fff;
    color: var(--brown);
    box-shadow: 0 4px 10px rgba(180, 140, 40, 0.18);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .mbti-btn:hover {
    transform: translateY(-4px) scale(1.04);
    background: var(--yellow);
  }

  .mbti-btn:active {
    transform: translateY(0) scale(0.98);
  }

  .result-card {
    display: none;
    background: #fffdf5;
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: var(--card-shadow);
    border: 3px solid var(--yellow);
    animation: pop 0.35s ease;
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .result-card.show {
    display: block;
  }

  .result-mbti-tag {
    display: inline-block;
    background: var(--yellow);
    color: var(--brown);
    font-weight: 700;
    font-size: 1.1rem;
    padding: 6px 18px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .pokemon-emoji {
    font-size: 5.5rem;
    line-height: 1;
    margin: 6px 0 10px;
  }

  .pokemon-name {
    font-size: 2rem;
    font-weight: 800;
    margin: 0 0 14px;
    color: var(--brown);
  }

  .pokemon-reason {
    font-size: 1.2rem;
    line-height: 1.6;
    color: var(--brown-light);
    margin: 0 auto 22px;
    max-width: 480px;
    white-space: pre-line;
  }

  .compat-box {
    background: var(--cream-dark);
    border-radius: 18px;
    padding: 16px 18px;
    margin: 0 auto 26px;
    max-width: 480px;
  }

  .compat-box .compat-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--yellow-dark);
    margin-bottom: 6px;
  }

  .compat-box .compat-body {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--brown);
  }

  .compat-box .compat-emoji {
    font-size: 1.6rem;
    vertical-align: middle;
    margin-right: 6px;
  }

  .reset-btn {
    font-size: 1.15rem;
    font-weight: 700;
    padding: 14px 32px;
    border: none;
    border-radius: 999px;
    background: var(--yellow-dark);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(180, 120, 20, 0.35);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .reset-btn:hover {
    background: #ff9f00;
    transform: translateY(-2px);
  }

  .hint {
    text-align: center;
    font-size: 1rem;
    color: var(--brown-light);
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🍯 MBTI로 포켓몬 찾기 🐾</h1>
    <p>나의 MBTI 유형을 골라보세요! 딱 맞는 포켓몬을 알려드릴게요.</p>
  </header>

  <div class="mbti-grid" id="mbtiGrid"></div>

  <p class="hint" id="hintText">👆 위에서 나의 MBTI를 선택해주세요</p>

  <div class="result-card" id="resultCard">
    <div class="result-mbti-tag" id="resultMbti"></div>
    <div class="pokemon-emoji" id="resultEmoji"></div>
    <div class="pokemon-name" id="resultName"></div>
    <p class="pokemon-reason" id="resultReason"></p>

    <div class="compat-box">
      <div class="compat-title">💛 궁합이 좋은 유형</div>
      <div class="compat-body">
        <span class="compat-emoji" id="compatEmoji"></span>
        <span id="compatText"></span>
      </div>
    </div>

    <button class="reset-btn" id="resetBtn">🔄 다시 고르기</button>
  </div>
</div>

<script>
  const data = {
    INTJ: { name: "뮤츠", emoji: "🧠", reason: "혼자 깊게 생각하며 큰 그림을 그리는 전략가예요.\n감정보다 논리와 계획을 앞세우는 모습이 뮤츠와 꼭 닮았어요.", compat: "ENFP" },
    INTP: { name: "메타몽", emoji: "🔬", reason: "호기심이 많고 새로운 아이디어를 탐구하는 걸 좋아해요.\n끝없이 변신하며 실험하는 메타몽처럼 생각이 자유로워요.", compat: "ENTJ" },
    ENTJ: { name: "리자몽", emoji: "🔥", reason: "목표를 향해 거침없이 나아가는 타고난 리더예요.\n강한 카리스마와 추진력이 리자몽의 불꽃과 잘 어울려요.", compat: "INTP" },
    ENTP: { name: "조로아크", emoji: "🎭", reason: "재치가 넘치고 새로운 도전을 즐기는 아이디어 뱅크예요.\n순발력 있게 상황을 바꿔나가는 모습이 조로아크 같아요.", compat: "INFJ" },
    INFJ: { name: "뮤", emoji: "✨", reason: "조용하지만 깊은 통찰력으로 사람과 세상을 이해해요.\n신비롭고 이상을 품은 모습이 전설의 포켓몬 뮤와 닮았어요.", compat: "ENTP" },
    INFP: { name: "이브이", emoji: "🌈", reason: "따뜻한 감성과 풍부한 상상력을 가진 몽상가예요.\n다양한 모습으로 진화할 수 있는 이브이처럼 가능성이 무궁무진해요.", compat: "ENFJ" },
    ENFJ: { name: "루카리오", emoji: "💙", reason: "다른 사람의 마음을 잘 살피고 이끌어주는 따뜻한 리더예요.\n상대의 기운을 읽어내는 루카리오처럼 공감 능력이 뛰어나요.", compat: "INFP" },
    ENFP: { name: "피카츄", emoji: "⚡", reason: "밝고 에너지 넘치며 누구와도 금방 친해지는 인싸예요.\n반짝이는 매력으로 주변을 즐겁게 만드는 피카츄와 똑 닮았어요.", compat: "INTJ" },
    ISTJ: { name: "메타그로스", emoji: "🤖", reason: "원칙을 지키고 맡은 일을 끝까지 해내는 믿음직한 사람이에요.\n체계적이고 견고한 메타그로스처럼 흔들림이 없어요.", compat: "ESFP" },
    ISFJ: { name: "라프라스", emoji: "🌊", reason: "다정하고 헌신적이며 주변 사람을 잘 챙기는 든든한 존재예요.\n남을 등에 태워 데려다주는 라프라스처럼 마음이 넓어요.", compat: "ESTP" },
    ESTJ: { name: "엠페르트", emoji: "👑", reason: "책임감이 강하고 조직을 잘 이끄는 타고난 관리자예요.\n위엄있고 질서를 중시하는 모습이 엠페르트와 잘 맞아요.", compat: "ISFP" },
    ESFJ: { name: "토게피", emoji: "🥚", reason: "따뜻한 마음으로 주변 사람들을 살뜰히 챙기는 살림꾼이에요.\n사람들 곁에서 행복을 나눠주는 토게피처럼 다정해요.", compat: "ISTP" },
    ISTP: { name: "개굴닌자", emoji: "🥷", reason: "말은 적지만 손으로 뚝딱 문제를 해결하는 만능 재주꾼이에요.\n조용히 움직이다 결정적일 때 활약하는 개굴닌자 같아요.", compat: "ESFJ" },
    ISFP: { name: "세레비", emoji: "🍃", reason: "자유롭고 감성적이며 자기만의 세계를 소중히 여겨요.\n자연 속에서 조용히 지내는 세레비처럼 평화로운 매력이 있어요.", compat: "ESTJ" },
    ESTP: { name: "윈디", emoji: "🐕", reason: "대담하고 행동력이 넘치는 타고난 모험가예요.\n망설임 없이 달려나가는 윈디처럼 순간 판단력이 빨라요.", compat: "ISFJ" },
    ESFP: { name: "푸린", emoji: "🎤", reason: "사람들 앞에서 빛나는 걸 좋아하는 타고난 엔터테이너예요.\n노래와 즐거움으로 분위기를 띄우는 푸린과 잘 어울려요.", compat: "ISTJ" }
  };

  const grid = document.getElementById("mbtiGrid");
  const resultCard = document.getElementById("resultCard");
  const hintText = document.getElementById("hintText");

  Object.keys(data).forEach(type => {
    const btn = document.createElement("button");
    btn.className = "mbti-btn";
    btn.textContent = type;
    btn.addEventListener("click", () => showResult(type));
    grid.appendChild(btn);
  });

  function showResult(type) {
    const info = data[type];
    const compatInfo = data[info.compat];

    document.getElementById("resultMbti").textContent = type;
    document.getElementById("resultEmoji").textContent = info.emoji;
    document.getElementById("resultName").textContent = info.name;
    document.getElementById("resultReason").textContent = info.reason;
    document.getElementById("compatEmoji").textContent = compatInfo.emoji;
    document.getElementById("compatText").textContent =
      `${info.compat} (${compatInfo.name}) 유형과 특히 잘 맞아요!`;

    resultCard.classList.add("show");
    hintText.style.display = "none";
    grid.style.display = "none";

    resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    resultCard.classList.remove("show");
    grid.style.display = "grid";
    hintText.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
</script>
</body>
</html>
